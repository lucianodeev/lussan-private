name: Phase 2 static checks
on:
  pull_request:
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'tests/**'
      - '.github/workflows/phase2-checks.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Phase 2 static checks
        run: node tests/phase2-smoke.cjs
